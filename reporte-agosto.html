<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viajes Speedy · Informe mensual · Agosto 2026</title></head><body><p style="font-family:Inter,Arial,sans-serif;padding:24px">Cargando informe…</p><script>(async()=>{try{const files=['p1.txt','p2.txt','p3.txt','p4.txt'];const parts=await Promise.all(files.map(f=>fetch('reporte-agosto-full/'+f+'?v=2').then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div style="font-family:Inter,Arial,sans-serif;padding:32px;color:#14212B"><strong>No se pudo cargar el informe.</strong><br>Recarga la página.</div>';console.error(e)}})();</script></body></html>
